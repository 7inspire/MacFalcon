name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run tests
        run: swift test
      - name: Build Apple Silicon application
        run: ./scripts/build-app.sh
      - name: Verify architecture and bundle
        run: |
          [[ "$(lipo -archs dist/MacFalcon.app/Contents/MacOS/MacFalcon)" == "arm64" ]]
          codesign --verify --strict --verbose=2 dist/MacFalcon.app
          plutil -lint dist/MacFalcon.app/Contents/Info.plist
