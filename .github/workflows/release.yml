name: Signed release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACFALCON_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tag, version, and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Run this workflow on a version tag.' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          [[ "$version" == "$(tr -d '[:space:]' < VERSION)" ]] || { echo 'Tag and VERSION differ.' >&2; exit 1; }
          for name in MACFALCON_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo 'Release already exists; refusing to replace assets.' >&2; exit 1; fi
      - name: Test
        run: swift test
      - name: Build universal app
        run: MACFALCON_UNIVERSAL=1 ./scripts/build-app.sh
      - name: Import Developer ID, notarize and package
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d "${RUNNER_TEMP}/macfalcon-signing.XXXXXX")"
          keychain="$dir/signing.keychain-db"
          password="$(uuidgen)$(uuidgen)"
          cleanup() { security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$dir"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$dir/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$dir/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          ./scripts/notarize-release.sh
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/MacFalcon-$version-universal.dmg" dist/SHA256SUMS.txt --title "MacFalcon $version" --generate-notes --verify-tag
