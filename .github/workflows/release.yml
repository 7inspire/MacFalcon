name: Release (ad-hoc signed)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: ${{ vars.MACFALCON_RELEASE_MODE != 'notarized' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Run this workflow on a version tag.' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          [[ "$version" == "$(tr -d '[:space:]' < VERSION)" ]] || { echo 'Tag and VERSION differ.' >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo 'Release already exists; refusing to replace assets.' >&2; exit 1; fi
      - name: Test
        run: swift test
      - name: Build Apple Silicon app
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          [[ "$(lipo -archs dist/MacFalcon.app/Contents/MacOS/MacFalcon)" == "arm64" ]]
          codesign --verify --strict --verbose=2 dist/MacFalcon.app
      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          ./scripts/package-dmg.sh
          version="${GITHUB_REF_NAME#v}"
          hdiutil verify "dist/MacFalcon-$version-arm64.dmg"
          (cd dist && shasum -a 256 "MacFalcon-$version-arm64.dmg" > SHA256SUMS.txt)
      - name: Create signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/create-appcast.sh
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/MacFalcon-$version-arm64.dmg" dist/SHA256SUMS.txt dist/appcast.xml --title "MacFalcon $version" --notes-file docs/RELEASE_NOTES.md --generate-notes --verify-tag
