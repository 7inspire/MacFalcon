name: Release (ad-hoc signed)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Run this workflow on a version tag.' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          [[ "$version" == "$(tr -d '[:space:]' < VERSION)" ]] || { echo 'Tag and VERSION differ.' >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo 'Release already exists; refusing to replace assets.' >&2; exit 1; fi
      - name: Test
        run: swift test
      - name: Build universal app
        run: |
          set -euo pipefail
          MACFALCON_UNIVERSAL=1 ./scripts/build-app.sh
          lipo dist/MacFalcon.app/Contents/MacOS/MacFalcon -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 dist/MacFalcon.app
      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          ./scripts/package-dmg.sh
          version="${GITHUB_REF_NAME#v}"
          hdiutil verify "dist/MacFalcon-$version-universal.dmg"
          (cd dist && shasum -a 256 "MacFalcon-$version-universal.dmg" > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/MacFalcon-$version-universal.dmg" dist/SHA256SUMS.txt --title "MacFalcon $version" --notes-file docs/RELEASE_NOTES.md --generate-notes --verify-tag
